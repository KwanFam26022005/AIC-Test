pipeline:
  name: audio_feature_extraction_for_video_retrieval
  version: "0.1.0"
  schema_version: audio_feature_v1

audio_extraction:
  sample_rate: 16000
  channels: 1
  codec: pcm_s16le
  format: wav
  overwrite: false

vad:
  enabled: true
  method: energy_vad
  frame_ms: 30
  min_speech_duration_ms: 250
  min_silence_duration_ms: 700
  speech_pad_ms: 300
  max_speech_duration_sec: 30.0
  energy_threshold:
  energy_threshold_multiplier: 2.5
  energy_peak_ratio: 0.08
  min_rms: 120.0
  fallback_full_audio_when_no_speech: true

asr:
  enabled: true
  backend: faster-whisper
  model: large-v3
  model_path:
  language: vi
  device: cuda
  compute_type: float16
  beam_size: 1
  word_timestamps: false
  condition_on_previous_text: false
  vad_filter: false
  temperature: 0.0
  cpu_threads: 4
  num_workers: 1
  sort_jobs_by_duration: true
  debug_save_failed_chunks: true

text_cleaning:
  normalize_whitespace: true
  fix_simple_repetition: true
  add_basic_punctuation: true
  summary_mode: passthrough
  max_keywords: 8

quality_gate:
  enabled: true
  min_text_length: 5
  max_repetition_ratio: 0.35
  min_duration_sec: 0.5
  include_empty_features: false

